# Preserve original profiler identifiers such as ScatterNdUpdateSk.
[files]
# Prose is checked in build_report.py; these generated exports preserve raw IDs.
extend-exclude = ["**/report.html", "**/data/**", "**/preview-*.png"]

[default.extend-words]
ND = "ND"
CANN = "CANN"
cann = "cann"
typ = "typ"
# Original torch.arange / aclnnArange profiler identifiers, not prose typos.
arange = "arange"
Arange = "Arange"
